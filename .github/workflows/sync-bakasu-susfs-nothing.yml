name: Create clean Nothing stock base for BakaSU SUSFS

on:
  push:
    branches:
      - sync/bakasu-susfs-nothing-b4.1
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  prepare:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - name: Checkout custom integration branch with history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          token: ${{ secrets.GH_WORKFLOW_TOKEN }}

      - name: Fetch latest Nothing Phone 2 stock source
        shell: bash
        run: |
          set -euo pipefail
          git remote add nothing https://github.com/NothingOSS/android_kernel_msm-5.10_nothing_sm8475.git
          git fetch --no-tags nothing refs/heads/sm8475/b/mr:refs/remotes/nothing/sm8475/b/mr
          STOCK_SHA="$(git rev-parse refs/remotes/nothing/sm8475/b/mr)"
          echo "STOCK_SHA=$STOCK_SHA" >> "$GITHUB_ENV"
          echo "## Source" >> "$GITHUB_STEP_SUMMARY"
          echo "- Stock source: NothingOS 4.1 / Linux 5.10.252" >> "$GITHUB_STEP_SUMMARY"
          echo "- Stock commit: https://github.com/NothingOSS/android_kernel_msm-5.10_nothing_sm8475/commit/$STOCK_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "- Custom integration source: $(git rev-parse refs/remotes/origin/bakasu-susfs)" >> "$GITHUB_STEP_SUMMARY"

      - name: Create a fresh stock branch with the latest vendor-aware BakaSU SUSFS workflow
        shell: bash
        run: |
          set -euo pipefail
          TARGET_BRANCH="stock-bakasu-susfs-b4.1"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Start from the actual Nothing stock commit. Do not merge the
          # divergent Arter tree into it.
          git checkout --force -B "$TARGET_BRANCH" "$STOCK_SHA"

          mkdir -p .github/workflows
          git show refs/remotes/origin/bakasu-susfs:defconfig > defconfig
          git show refs/remotes/origin/bakasu-susfs:version > version
          git show refs/remotes/origin/bakasu-susfs:.github/workflows/build.yml > .github/workflows/build.yml

          # Identify this as a Nothing-stock-based port and package against
          # the boot image matching the stock source revision.
          python3 - <<'PY'
          from pathlib import Path

          path = Path(".github/workflows/build.yml")
          source = path.read_text()
          source = source.replace(
              "Build arter97 Nothing Phone 2 Kernel with BakaSU + SUSFS",
              "Build Nothing stock Phone 2 Kernel with BakaSU + SUSFS",
          )
          source = source.replace(
              'CONFIG_LOCALVERSION="-arter97-$KERNEL_VERSION-bakasu-susfs"',
              'CONFIG_LOCALVERSION="-nothing-stock-$KERNEL_VERSION-bakasu-susfs"',
          )
          source = source.replace("261014-1615", "260818-1726")
          lines = source.splitlines()
          filtered = []
          for line in lines:
              if line.strip().startswith('STOCK_SHA256='):
                  continue
              filtered.append(line)
          lines = filtered
          output = []
          i = 0
          while i < len(lines):
              line = lines[i]
              if (line.strip() == 'curl -fL --retry 3 "$STOCK_URL" -o "$WORKDIR/$STOCK_ARCHIVE"'
                      and i + 1 < len(lines)
                      and lines[i + 1].strip() == 'echo "$STOCK_SHA256  $WORKDIR/$STOCK_ARCHIVE" | sha256sum -c -'):
                  indent = line[:len(line) - len(line.lstrip())]
                  output.extend([
                      indent + 'HASH_LIST="Pong_B4.1-260818-1726-hash.sha256"',
                      indent + 'HASH_URL="https://github.com/spike0en/nothing_archive/releases/download/Pong_B4.1-260818-1726/$HASH_LIST"',
                      indent + 'curl -fL --retry 3 "$HASH_URL" -o "$WORKDIR/$HASH_LIST"',
                      indent + 'STOCK_SHA256="$(grep -F "$STOCK_ARCHIVE" "$WORKDIR/$HASH_LIST" | head -n 1 | awk \'{print $1}\')"',
                      indent + 'test -n "$STOCK_SHA256"',
                      indent + 'curl -fL --retry 3 "$STOCK_URL" -o "$WORKDIR/$STOCK_ARCHIVE"',
                      indent + 'echo "$STOCK_SHA256  $WORKDIR/$STOCK_ARCHIVE" | sha256sum -c -',
                  ])
                  i += 2
                  continue
              output.append(line)
              i += 1
          source = "\n".join(output) + "\n"
          source = source.replace(
              "Pong-BakaSU-SUSFS-NothingStock-B4.1-260818-1726-TEST-ONLY",
              "Pong-BakaSU-SUSFS-NothingStock-B4.1-260818-1726-TEST-ONLY",
          )
          path.write_text(source)

          Path("version").write_text("b4.1-260818-1726-stock\n")
          PY

          cat > PORTING_NOTES.md <<'EOF'
          # Nothing stock BakaSU + SUSFS port

          This branch is based directly on NothingOSS sm8475/b/mr (Linux 5.10.252).
          It intentionally does not merge the divergent Arter kernel history.

          The existing BakaSU/SUSFS build workflow and tested Pong defconfig are
          carried over for the first compile-validation pass. Arter-only source
          features, including charging-current control and vibration changes, are
          not yet declared ported; they must be reviewed and applied as focused
          patches against this stock base after the BakaSU/SUSFS baseline builds.
          The packaged test boot image is pinned to the matching Pong B4.1-260818-1726
          stock release and is TEST-ONLY.
          EOF

          git add -f .github/workflows/build.yml defconfig version PORTING_NOTES.md
          git commit -m "Start BakaSU SUSFS port from NothingOS 4.1 stock 5.10.252"
          echo "TARGET_BRANCH=$TARGET_BRANCH" >> "$GITHUB_ENV"
          echo "## New stock-based branch" >> "$GITHUB_STEP_SUMMARY"
          echo "- Branch: $TARGET_BRANCH" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Parent: $(git rev-parse HEAD^)" >> "$GITHUB_STEP_SUMMARY"

      - name: Push stock-based branch
        shell: bash
        run: |
          set -euo pipefail
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"

      - name: Dispatch BakaSU SUSFS build on stock base
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run build.yml --ref "$TARGET_BRANCH"
          echo "Dispatched BakaSU/SUSFS compile and matching stock boot-image validation." >> "$GITHUB_STEP_SUMMARY"
