name: Pong stock source preflight

on:
  workflow_dispatch:
  push:
    branches:
      - pong-bakasu-susfs

permissions:
  contents: read

jobs:
  source-preflight:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout migration baseline
        uses: actions/checkout@v4
        with:
          ref: pong-bakasu-susfs
          fetch-depth: 1

      - name: Verify stock source identity
        shell: bash
        run: |
          set -euo pipefail
          echo "Commit: $(git rev-parse HEAD)"
          sed -n '1,5p' Makefile
          test -d arch/arm64
          test -d drivers
          test -d security/selinux
          test -f fs/exec.c
          test -f drivers/soc/qcom/soc_sleep_stats.c

      - name: Discover actual Qualcomm Waipio build target
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p preflight
          find arch/arm64/configs -type f -print | sort > preflight/all-arm64-configs.txt
          cp build.targets preflight/build.targets
          echo "Declared build targets:"
          cat build.targets
          grep -qx 'build.config.msm.waipio' build.targets
          test -f build.config.msm.waipio
          test -f build.config.msm.gki
          test -f arch/arm64/configs/vendor/waipio_GKI.config
          test -f arch/arm64/configs/vendor/waipio_consolidate.config
          {
            echo "Selected target: build.config.msm.waipio"
            echo "Architecture family: Waipio (SM8475 platform family)"
            echo "GKI variant: VARIANT=gki"
            echo "Config fragment: arch/arm64/configs/vendor/waipio_GKI.config"
            echo "Generated defconfig is assembled by build.config.msm.gki; it is not a checked-in *defconfig."
          } | tee preflight/selected-build-target.txt
          grep -nE 'MSM_ARCH=|VARIANTS=|DEFCONFIG=|waipio_GKI.config|BUILD_BOOT_IMG|BUILD_VENDOR_DLKM' build.config.msm.waipio build.config.msm.gki > preflight/waipio-build-config-evidence.txt

      - name: Verify source is not contaminated by Arter build metadata
        shell: bash
        run: |
          set -euo pipefail
          echo "Kernel Makefile version: $(awk '/^VERSION =/{v=$3} /^PATCHLEVEL =/{p=$3} /^SUBLEVEL =/{s=$3} END{print v "." p "." s}' Makefile)"
          if grep -R -n --include='*defconfig' --include='*.config' --include='*.yml' --include='*.yaml' 'arter97 r45b2\|CONFIG_LOCALVERSION="-arter97"' arch/arm64/configs .github 2>/dev/null; then
            echo "::warning::Arter-derived metadata found in configuration/workflows; review before porting features."
          else
            echo "No obvious Arter build metadata found in configs/workflows."
          fi

      - name: Upload preflight report
        uses: actions/upload-artifact@v4
        with:
          name: pong-stock-source-preflight
          path: preflight/
          if-no-files-found: error
          retention-days: 7
