name: Build Pong FinaSU kernel

on:
  workflow_dispatch:
  push:
    branches:
      - finasu-clean-base

permissions:
  contents: read

concurrency:
  group: finasu-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Nothing Phone 2 kernel with FinaSU
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          ref: finasu-clean-base
          submodules: recursive
          fetch-depth: 1

      - name: Restore LLVM toolchain cache
        id: llvm-cache
        uses: actions/cache@v4
        with:
          path: ~/llvm
          key: llvm-22.1.0-ubuntu-24.04-x86_64
          restore-keys: |
            llvm-22.1.0-ubuntu-22.04-x86_64
            llvm-22.1.0-

      - name: Verify build tools and bootstrap bc
        shell: bash
        run: |
          set -euo pipefail
          for tool in git make gcc g++ bison flex curl python3 perl tar gzip xz; do
            command -v "$tool" >/dev/null 2>&1 || {
              echo "::error::Required runner tool is missing: $tool"
              exit 1
            }
          done

          if ! command -v bc >/dev/null 2>&1; then
            git clone https://github.com/gavinhoward/bc.git bc-src
            git -C bc-src checkout --detach 1a8e2e652a0bdfc60349be7b352c954690eaa179
            (
              cd bc-src
              ./configure.sh --disable-generated-tests --disable-nls \
                --disable-history --disable-man-pages --disable-dc \
                --prefix="$HOME/.local"
              make -j2
              make install
            )
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          fi
          command -v bc
          bc --version || true

      - name: Install LLVM 22.1.0
        if: steps.llvm-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p "$HOME/llvm"
          curl -fL --retry 3 https://www.kernel.org/pub/tools/llvm/files/llvm-22.1.0-x86_64.tar.gz -o llvm.tar.gz
          tar -xzf llvm.tar.gz -C "$HOME/llvm" --strip-components=1
          rm llvm.tar.gz

      - name: Configure LLVM
        run: |
          set -euo pipefail
          test -x "$HOME/llvm/bin/clang"
          echo "$HOME/llvm/bin" >> "$GITHUB_PATH"
          echo "LLVM_PATH=$HOME/llvm/bin/" >> "$GITHUB_ENV"

      - name: Install ccache and cross binutils
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ccache gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi
          echo "CROSS_COMPILE=aarch64-linux-gnu-" >> "$GITHUB_ENV"
          echo "CROSS_COMPILE_ARM32=arm-linux-gnueabi-" >> "$GITHUB_ENV"
          command -v ccache

      - name: Integrate pinned FinaSU v1.6.0
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/LyraVoid/FinaSU.git FinaSU
          git -C FinaSU fetch --depth=1 origin tag v1.6.0
          git -C FinaSU checkout --detach v1.6.0
          test "$(git -C FinaSU describe --tags --exact-match)" = "v1.6.0"
          bash FinaSU/kernel/setup.sh v1.6.0
          test -L drivers/kernelsu
          test -f drivers/kernelsu/Kconfig
          ! grep -q 'CONFIG_KSU_MANUAL_HOOK' fs/exec.c fs/open.c fs/stat.c

      - name: Prepare FinaSU defconfig
        run: |
          set -euo pipefail
          cp defconfig arch/arm64/configs/custom_defconfig
          KERNEL_VERSION="$(tr -d '\r\n' < version)"
          test -n "$KERNEL_VERSION"
          sed -i "s|^CONFIG_LOCALVERSION=.*|CONFIG_LOCALVERSION=\"-arter97-$KERNEL_VERSION-finasu\"|" arch/arm64/configs/custom_defconfig
          sed -i '/^# BakaSU manual hook$/d; /^CONFIG_KSU_MANUAL_HOOK=/d' arch/arm64/configs/custom_defconfig
          cat >> arch/arm64/configs/custom_defconfig <<'EOF'

          # Test without lazy initcall; this changes vendor driver init timing.
          CONFIG_LAZY_INITCALL=n
          # FinaSU Kprobes requires loadable-module core support.
          CONFIG_MODULES=y
          # Built-in FinaSU; SUSFS intentionally deferred
          CONFIG_KSU=y
          CONFIG_KPROBES=y
          CONFIG_EXT4_FS=y
          CONFIG_KALLSYMS_ALL=y
          CONFIG_HEADERS_INSTALL=y
          CONFIG_KSU_HOOK_TRACEPOINT=y
          EOF

      - name: Configure and verify FinaSU
        env:
          ARCH: arm64
          SUBARCH: arm64
          LLVM: "1"
          LLVM_IAS: "1"
        run: |
          set -euo pipefail
          make O=out custom_defconfig
          make O=out olddefconfig

          echo "---- Resolved FinaSU kernel configuration ----"
          grep -E '^(CONFIG_(LAZY_INITCALL|MODULES|HAVE_KPROBES|KPROBES|KSU|KSU_HOOK_TRACEPOINT|EXT4_FS|HEADERS_INSTALL|KALLSYMS_ALL)=|# CONFIG_(LAZY_INITCALL|MODULES|HAVE_KPROBES|KPROBES|KSU|KSU_HOOK_TRACEPOINT|EXT4_FS|HEADERS_INSTALL|KALLSYMS_ALL) is not set)' out/.config || true

          for config in \
            CONFIG_MODULES \
            CONFIG_HAVE_KPROBES \
            CONFIG_KSU \
            CONFIG_KSU_HOOK_TRACEPOINT \
            CONFIG_KPROBES \
            CONFIG_EXT4_FS \
            CONFIG_HEADERS_INSTALL \
            CONFIG_KALLSYMS_ALL; do
            if ! grep -q "^${config}=y$" out/.config; then
              echo "::error::Required FinaSU option missing or disabled: ${config}"
              exit 1
            fi
          done

          ! grep -q '^CONFIG_LAZY_INITCALL=y$' out/.config
          ! grep -q '^CONFIG_KSU_MANUAL_HOOK=y$' out/.config
          ! grep -q '^CONFIG_KSU_HOOK_SUSFS_INLINE=y$' out/.config

          make O=out headers_install INSTALL_HDR_PATH="$GITHUB_WORKSPACE/out/usr"
          echo "---- Installed UAPI headers ----"
          find out/usr/include -maxdepth 3 -type f | sed -n '1,40p'
          test -f out/usr/include/linux/unistd.h

      - name: Build kernel Image.gz
        env:
          ARCH: arm64
          SUBARCH: arm64
          LLVM: "1"
          LLVM_IAS: "1"
        run: |
          set -euo pipefail
          make -j2 O=out KSU_REQUIRE_PREINIT=1 Image.gz
          test -s out/arch/arm64/boot/Image.gz

      - name: Upload FinaSU test artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pong-FinaSU-Image-TEST-ONLY
          path: |
            out/arch/arm64/boot/Image.gz
            out/.config
          retention-days: 7
