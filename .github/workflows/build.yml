name: Build arter97 Nothing Phone 2 Kernel with BakaSU

on:
  workflow_dispatch:
  push:
    branches:
      - bakasu-integration

permissions:
  contents: read

jobs:
  build:
    name: Build Pong kernel with BakaSU manual hooks
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          submodules: recursive
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache curl flex git gnupg gperf \
            libncurses5-dev libssl-dev libxml2 libxml2-utils lzop rsync \
            schedtool squashfs-tools xsltproc zip zlib1g-dev python3 \
            libelf-dev lz4 cpio fakeroot dwarves

      - name: Install LLVM 22.1.0
        run: |
          mkdir -p "$HOME/llvm"
          curl -fL https://www.kernel.org/pub/tools/llvm/files/llvm-22.1.0-x86_64.tar.gz -o llvm.tar.gz
          tar -xzf llvm.tar.gz -C "$HOME/llvm" --strip-components=1
          echo "$HOME/llvm/bin" >> "$GITHUB_PATH"
          echo "LLVM_PATH=$HOME/llvm/bin/" >> "$GITHUB_ENV"
          rm llvm.tar.gz

      - name: Integrate pinned BakaSU source
        run: |
          curl -fLSs https://raw.githubusercontent.com/Baka-SU/BakaSU/516d3e87fbc986ccefdde2c2765f1700612441a9/kernel/setup.sh -o setup-bakasu.sh
          bash setup-bakasu.sh 516d3e87fbc986ccefdde2c2765f1700612441a9

      - name: Prepare Pong defconfig
        run: |
          cp defconfig arch/arm64/configs/custom_defconfig
          cat >> arch/arm64/configs/custom_defconfig <<'EOF'

          # BakaSU
          CONFIG_KSU=y
          CONFIG_KSU_MANUAL_HOOK=y
          EOF

      - name: Verify LLVM toolchain
        run: |
          test -x "$HOME/llvm/bin/clang"
          command -v clang
          clang --version | head -n 1
          echo "LLVM_PATH=$LLVM_PATH"

      - name: Configure and verify BakaSU
        env:
          ARCH: arm64
          SUBARCH: arm64
          LLVM: "1"
          LLVM_IAS: "1"
        run: |
          make O=out custom_defconfig
          make O=out olddefconfig
          grep -q '^CONFIG_KSU=y$' out/.config
          grep -q '^CONFIG_KSU_MANUAL_HOOK=y$' out/.config
          grep -q '^CONFIG_KALLSYMS_ALL=y$' out/.config
          ! grep -q '^CONFIG_KSU_TRACEPOINT_HOOK=y$' out/.config

      - name: Build kernel Image.gz
        env:
          ARCH: arm64
          SUBARCH: arm64
          LLVM: "1"
          LLVM_IAS: "1"
        run: |
          make -j"$(nproc --all)" O=out Image.gz
          test -s out/arch/arm64/boot/Image.gz

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Pong-BakaSU-Image-TEST-ONLY
          path: |
            out/arch/arm64/boot/Image.gz
            out/.config
          retention-days: 7
